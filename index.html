<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="szoveg">Találd ki a számot! (1-99)</p>

    <p id="tippek_szoveg">Tippek : -</p>

    <br><input type="number" id="tipp">

    <button onclick="SzamKitalalo()">
        Gomb
    </button>

    <script>
        const szam = Math.floor(Math.random() * 98) + 1;
        function SzamKitalalo() {
            const szoveg = document.getElementById("szoveg");
            const tippek_szoveg = document.getElementById('tippek_szoveg');

            let tipp = document.getElementById("tipp").value;
            let tippek = [0];

            alert(szam);

            if (szam == 0) {
                

                alert(szam = 0);
                alert(szam);
            }

            if (tipp != szam) {
                szoveg.textContent = "Helytelen tipp, próbáld újra!";

                tippek.push(tipp);
                tippek_szoveg.textContent = "Tippek : ";
                for(let i = 0; i < tippek.length; i++)
                {
                    tippek.szoveg.textContent +=  tippek + "; ";
                }
                

            }
            else if (tipp == szam)
                szoveg.textContent = "Tipped helyes!";


        }


    </script>


</body>

</html>
