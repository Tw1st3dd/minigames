<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="szoveg">Találd ki a számot! (1-99)</p>

    <p id="tippek_szoveg">Tippek : -</p>

    <br><input type="number" id="tipp">

    <button onclick="SzamKitalalo()">
        Gomb
    </button>

    <script>
        function SzamKitalalo() {
            const szam = 0;
            const szoveg = document.getElementById("szoveg");
            const tippek_szoveg = document.getElementById('tippek_szoveg');

            let tipp = document.getAnimations("tipp").value;
            let tippek = [0];



            let nyero_szam = localStorage.setItem('nyero_szam', szam);


            if (nyero_szam == 0) {
                const szam = Math.floor(Math.random() * 98) + 1;

                alert(1);
                alert(szam);
            }

            if (tipp != szam) {
                szoveg.textContent = "Helytelen tipp, próbáld újra!";

                alert(szam);

                tippek.push(tipp);
                tippek_szoveg.textContent = "Tippek : " + tippek;

            }
            else if (tipp == szam)
                szoveg.textContent = "Tipped helyes!";


        }


    </script>


</body>

</html>
